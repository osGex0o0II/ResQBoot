name: Build U-Boot for IPQ Devices

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ipq_type:
        description: 'Please select the IPQ type(s) to build. for example: ipq6018,ipq807x,all = all types.'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ipq40xx
          - ipq5018
          - ipq5332
          - ipq6018
          - ipq806x
          - ipq807x
          - ipq9574

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      NODE_VERSION: '24'
      TOOLCHAIN: "https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git"
      DEPENDENCIES: "build-essential libncurses5-dev gawk git gettext libssl-dev python3 wget cpio flex bison bc rsync zopfli device-tree-compiler"

    strategy:
      matrix:
        ipq_type: ['ipq40xx', 'ipq5018', 'ipq5332', 'ipq6018', 'ipq806x', 'ipq807x', 'ipq9574']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show current timezone and time
        run: |
          echo "Current timezone: $(timedatectl show -p Timezone --value)"
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Check device metadata
        run: python3 scripts/check_devices.py

      - name: Setup Node.js 24
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ env.DEPENDENCIES }}

      - name: Install Node.js packages(minifier, css, js, terser) for Web interface compression
        run: sudo npm install -g html-minifier-terser clean-css terser svgo

      - name: Clone Toolchain to staging_dir
        run: |
          git clone --depth=1 ${{ env.TOOLCHAIN }} ../staging_dir
          echo "Clone Toolchain to staging_dir"
          ls -la ../staging_dir/
          if [ -d "../staging_dir/toolchain-arm_cortex-a7_gcc-5.2.0_musl-1.1.16_eabi/bin" ]; then
            echo "Toolchain bin path verified"
          else
            echo "Warning: Expected path not found"
            find ../staging_dir -name "*gcc*" | head -10
          fi

      - name: Build ${{ matrix.ipq_type }} U-Boot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ipq_type == 'all' || inputs.ipq_type == matrix.ipq_type }}
        run: ./build.sh ${{ matrix.ipq_type }}

      - name: Upload compiled artifacts (bin directory)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ipq_type == 'all' || inputs.ipq_type == matrix.ipq_type }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: u-boot-${{ matrix.ipq_type }}
          path: bin/
          retention-days: 30

      - name: Show bin directory content
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.ipq_type == 'all' || inputs.ipq_type == matrix.ipq_type }}
        run: |
          echo " ${{ matrix.ipq_type }} Build completed!"
          ls -la bin/ || echo "bin directory is empty"

  release:
    name: Create Release
    needs: build
    if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.ipq_type == 'all'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install GitHub CLI and jq
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: u-boot-*
          merge-multiple: true

      - name: Confirm current timezone is Asia/Shanghai
        run: |
          echo "Current timezone: $(timedatectl show -p Timezone --value)"
          echo "Current time: $(date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Set TODAY and BUILD_TIME environment variables
        run: |
          echo "TODAY=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date '+%H:%M:%S')" >> $GITHUB_ENV
          echo "FULL_BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Prepare release assets
        run: |
          python3 scripts/prepare_release_assets.py --artifacts-dir artifacts --output-dir release-assets --body release-notes.md
          (cd release-assets && sha256sum --quiet -c SHA256SUMS)

      - name: Append validation scope
        run: |
          cat >> release-notes.md <<'EOF'

          > Validation scope: this release was built and cross-checked by the 7-platform CI. Hardware runtime validation (boot / flash / recovery) was not performed for this release. The `Tested` column above comes from the project device metadata and is not a claim from this build.
          EOF

      - name: Verify main still points at the built commit
        run: |
          MAIN_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          if [ "$MAIN_SHA" != "${{ github.sha }}" ]; then
            echo "main moved to $MAIN_SHA; refusing to publish build ${{ github.sha }}"
            exit 1
          fi

      - name: Create draft release and upload assets
        run: |
          DRAFT_TAG="v${{ env.TODAY }}-draft-${{ github.run_id }}"
          EXPECTED=$(find release-assets -maxdepth 1 -type f | wc -l)
          echo "DRAFT_TAG=$DRAFT_TAG" >> $GITHUB_ENV
          echo "EXPECTED_ASSETS=$EXPECTED" >> $GITHUB_ENV
          echo "Preparing $EXPECTED assets in draft $DRAFT_TAG"

          if gh release view "$DRAFT_TAG" >/dev/null 2>&1; then
            gh release delete "$DRAFT_TAG" --yes
          fi

          DRAFT_ID=$(gh api -X POST repos/${{ github.repository }}/releases \
            -f tag_name="$DRAFT_TAG" \
            -f target_commitish="${{ github.sha }}" \
            -f name="v${{ env.TODAY }}" \
            -F body=@release-notes.md \
            -F draft=true \
            --jq .id)
          echo "Draft release id: $DRAFT_ID"

          gh release upload "$DRAFT_TAG" release-assets/* --clobber

          COUNT=$(gh release view "$DRAFT_TAG" --json assets --jq '.assets | length')
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "draft has $COUNT assets, expected $EXPECTED"
            exit 1
          fi

          LOCAL=$(stat -c%s release-assets/IPQ40xx-Aliyun-AP4220.elf)
          REMOTE=$(gh release view "$DRAFT_TAG" --json assets \
            --jq '.assets[] | select(.name=="IPQ40xx-Aliyun-AP4220.elf") | .size')
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "sample asset size mismatch: local=$LOCAL remote=$REMOTE"
            exit 1
          fi

      - name: Replace published release with the verified draft
        run: |
          TARGET_TAG="v${{ env.TODAY }}"
          MAIN_SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          if [ "$MAIN_SHA" != "${{ github.sha }}" ]; then
            echo "main moved to $MAIN_SHA; refusing to publish draft $DRAFT_TAG"
            exit 1
          fi

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Replacing existing release $TARGET_TAG"
            gh release delete "$TARGET_TAG" --yes
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TARGET_TAG" 2>/dev/null || true
          fi

          gh release edit "$DRAFT_TAG" --tag "$TARGET_TAG" \
            --target "${{ github.sha }}" --draft=false

          TAG_SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/$TARGET_TAG --jq .object.sha)
          if [ "$TAG_SHA" != "${{ github.sha }}" ]; then
            echo "tag $TARGET_TAG points at $TAG_SHA, expected ${{ github.sha }}"
            exit 1
          fi

          COUNT=$(gh release view "$TARGET_TAG" --json assets --jq '.assets | length')
          if [ "$COUNT" -ne "$EXPECTED_ASSETS" ]; then
            echo "published release has $COUNT assets, expected $EXPECTED_ASSETS"
            exit 1
          fi

          echo "Published $TARGET_TAG at ${{ github.sha }} with $COUNT assets"
